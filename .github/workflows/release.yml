name: Release

on:
  push:
    tags: ["v*"]

# Creates a GitHub Release from a pushed version tag.
# Workflow: update CHANGELOG → commit → git tag vX.Y.Z → git push --follow-tags.
permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          awk "/^## \[${VERSION#v}\]/{flag=1; next} /^## \[/{if(flag) exit} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for ${VERSION#v}" >&2
            exit 1
          fi
          echo "notes_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.notes_path }}"
