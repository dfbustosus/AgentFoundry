name: Publish npm

on:
  release:
    types: [published]

# npm trusted publishing exchanges this short-lived OIDC token for publish
# authority. No NPM_TOKEN is stored in GitHub.
permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: agent-systems

jobs:
  publish:
    name: Publish verified package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1. Pin for reproducibility.
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies (locked)
        run: npm ci

      - name: Verify tag, package version, and npm dist-tag
        id: version
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version $VERSION does not match release tag $TAG_VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify source, API, and publishable artifact
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run package:verify

      - name: Publish with OIDC and provenance
        run: npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"

      - name: Verify registry artifact
        run: |
          PUBLISHED="$(npm view "agent-systems-foundry@${{ steps.version.outputs.version }}" version)"
          test "$PUBLISHED" = "${{ steps.version.outputs.version }}"
          echo "Verified agent-systems-foundry@$PUBLISHED on npm"
