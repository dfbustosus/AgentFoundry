name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — saves minutes, keeps signal fresh.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository.
# Tests run fully offline (mocked model) — no secrets are required or provided.
permissions:
  contents: read

defaults:
  run:
    working-directory: agent-systems

jobs:
  lint:
    name: Lint + format (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-systems/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Biome check
        run: npm run lint

  test:
    name: Typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent-systems/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (offline, mocked model)
        run: npm test
